name: Publier Instagram

on:
  schedule:
    # Deux publications par jour, midi et soir. Heures de Paris, converties en UTC.
    # 12:30 Paris été (UTC+2) = 10:30 UTC — repasser à '30 11 * * *' au changement d'heure d'hiver (fin octobre)
    - cron: '30 10 * * *'
    # 19:00 Paris été (UTC+2) = 17:00 UTC — repasser à '0 18 * * *' au changement d'heure d'hiver
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Tester sans publier (dry-run)'
        type: boolean
        default: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Installer dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publier (arabe)
        env:
          IG_USER_ID_ARABE: ${{ secrets.IG_USER_ID_ARABE }}
          IG_TOKEN_ARABE: ${{ secrets.IG_TOKEN_ARABE }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python publier.py --niche arabe --dry-run
          else
            python publier.py --niche arabe
          fi

      - name: Publier (maths-prepa)
        env:
          IG_USER_ID_MATHS_PREPA: ${{ secrets.IG_USER_ID_MATHS_PREPA }}
          IG_TOKEN_MATHS_PREPA: ${{ secrets.IG_TOKEN_MATHS_PREPA }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          # La niche ne part que lorsque "actif" passe à true dans niches/config.json.
          # Chromium (~1 min d'installation) n'est donc téléchargé que si besoin.
          actif=$(python -c "import json; n=[x for x in json.load(open('niches/config.json'))['niches'] if x['id']=='maths-prepa'][0]; print('oui' if n.get('actif') else 'non')")
          if [ "$actif" != "oui" ]; then
            echo "Niche maths-prepa inactive — rien à publier."
            exit 0
          fi
          python -m playwright install --with-deps chromium
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python publier.py --niche maths-prepa --dry-run
          else
            python publier.py --niche maths-prepa
          fi

      - name: Publier (coreen) — test manuel migration Instagram Login
        if: github.event_name == 'workflow_dispatch'
        env:
          IG_USER_ID_COREEN: ${{ secrets.IG_USER_ID_COREEN }}
          IG_TOKEN_COREEN: ${{ secrets.IG_TOKEN_COREEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python publier.py --niche coreen --dry-run
          else
            python publier.py --niche coreen
          fi

      - name: Commiter historique
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add niches/arabe/historique.json niches/maths-prepa/historique.json niches/coreen/historique.json || true
          git commit -m "Mise à jour historique $(date -u +'%Y-%m-%d %H:%M UTC')" || true
          git push || true

      - name: Alerter en cas d'erreur
        if: failure()
        run: echo "Publication échouée. Vérifier les secrets et les logs."
