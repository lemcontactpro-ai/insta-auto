name: Publier Instagram

on:
  schedule:
    # 08:00 Paris été (UTC+2) = 06:00 UTC — repasser à '0 7 * * *' au changement d'heure d'hiver (fin octobre)
    - cron: '0 6 * * *'
    # 13:30 Paris été (UTC+2) = 11:30 UTC — repasser à '30 12 * * *' au changement d'heure d'hiver
    - cron: '30 11 * * *'
    # 19:00 Paris été (UTC+2) = 17:00 UTC — repasser à '0 18 * * *' au changement d'heure d'hiver
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Tester sans publier (dry-run)'
        type: boolean
        default: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Installer dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publier (arabe)
        env:
          IG_USER_ID_ARABE: ${{ secrets.IG_USER_ID_ARABE }}
          IG_TOKEN_ARABE: ${{ secrets.IG_TOKEN_ARABE }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python publier.py --niche arabe --dry-run
          else
            python publier.py --niche arabe
          fi

      - name: Commiter historique
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add niches/arabe/historique.json || true
          git commit -m "Mise à jour historique $(date -u +'%Y-%m-%d %H:%M UTC')" || true
          git push || true

      - name: Alerter en cas d'erreur
        if: failure()
        run: echo "Publication échouée. Vérifier les secrets et les logs."
